# The UI image's only server. The API is reached by Service name inside the cluster; the
# browser talks to this server alone (through a localhost port-forward before S6).
server {
    listen 8080;
    root /usr/share/nginx/html;
    server_tokens off;

    location /api/ {
        proxy_pass http://vyom-api:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_read_timeout 90s;  # chat has a 60 s deadline in the API
    }

    # The UI has client-side routes (/kubernetes); unknown paths return the app shell.
    location / {
        try_files $uri /index.html;
    }
}
