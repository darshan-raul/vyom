namespace: cloud-cost-compass

image:
  repository: cloud-cost-compass
  tag: latest
  pullPolicy: IfNotPresent

imagePullSecrets: []

global:
  ecrRegistry: ""
  vaultAddr: http://vault:8200
  keycloakUrl: http://keycloak:8080
  postgresUrl: postgres:5432

vault:
  enabled: true
  devMode: true

keycloak:
  enabled: true
  realmImport:
    enabled: true
    filename: ccc-realm.json

cloudnative-pg:
  enabled: true

postgres:
  enabled: true
  cluster:
    spec:
      instances: 1
      storage:
        size: 1Gi
        storageClass: standard
      resources:
        limits:
          cpu: 500m
          memory: 512Mi
        requests:
          cpu: 100m
          memory: 128Mi

qdrant:
  enabled: true
  persistence:
    enabled: false
  resources:
    limits:
      cpu: 500m
      memory: 1Gi
    requests:
      cpu: 100m
      memory: 256Mi

mcpServer:
  enabled: true
  replicaCount: 1
  image:
    repository: cloud-cost-compass/mcp-server
    tag: latest
  resources:
    limits:
      cpu: 500m
      memory: 512Mi
    requests:
      cpu: 100m
      memory: 128Mi

streamlit:
  enabled: true
  replicaCount: 1
  image:
    repository: cloud-cost-compass/app
    tag: latest
  resources:
    limits:
      cpu: 1000m
      memory: 1Gi
    requests:
      cpu: 250m
      memory: 256Mi

ragService:
  enabled: true
  # No candidate is selected before regional access and B3.5 policy checks.
  bedrock:
    embeddingModelId: ""
    embeddingAllowedModels: ""
    embeddingDimensions: 1024
  replicaCount: 1
  image:
    repository: cloud-cost-compass/rag-service
    tag: latest
  resources:
    limits:
      cpu: 500m
      memory: 1Gi
    requests:
      cpu: 100m
      memory: 256Mi

migrations:
  enabled: true

gateway:
  enabled: true
