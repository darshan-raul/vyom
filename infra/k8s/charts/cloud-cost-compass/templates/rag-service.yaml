{{- if .Values.ragService.enabled -}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}-rag-service-config
  namespace: {{ .Release.Namespace }}
data:
  DATABASE_URL: "postgresql://postgres:postgres@{{ .Release.Name }}-postgres:5432/cccdb"
  QDRANT_URL: "http://{{ .Release.Name }}-qdrant:6334"
  BEDROCK_REGION: "ap-south-1"
  BEDROCK_EMBEDDING_MODEL_ID: {{ .Values.ragService.bedrock.embeddingModelId | quote }}
  BEDROCK_EMBEDDING_ALLOWED_MODELS: {{ .Values.ragService.bedrock.embeddingAllowedModels | quote }}
  BEDROCK_EMBEDDING_DIMENSIONS: {{ .Values.ragService.bedrock.embeddingDimensions | quote }}
  BEDROCK_POLICY_FILE: "/etc/secrets/bedrock-policy.json"
  VAULT_ADDR: "{{ .Values.global.vaultAddr }}"
  SECRETS_DIR: "/etc/secrets"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-rag-service
  namespace: {{ .Release.Namespace }}
spec:
  replicas: {{ .Values.ragService.replicaCount }}
  selector:
    matchLabels:
      app: rag-service
  template:
    metadata:
      labels:
        app: rag-service
    spec:
      serviceAccountName: {{ .Release.Name }}-rag-service-sa
      {{- if .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- range .Values.imagePullSecrets }}
        - name: {{ .name }}
        {{- end }}
      {{- end }}
      containers:
      - name: rag-service
        image: {{ .Values.ragService.image.repository }}:{{ .Values.ragService.image.tag }}
        ports:
        - containerPort: 8001
        envFrom:
        - configMapRef:
            name: {{ .Release.Name }}-rag-service-config
        volumeMounts:
        - name: rendered-secrets
          mountPath: /etc/secrets
          readOnly: true
        {{- if .Values.ragService.resources }}
        resources:
          {{- toYaml .Values.ragService.resources | nindent 10 }}
        {{- end }}
      - name: vault-agent
        image: hashicorp/vault:1.16
        args:
        - agent
        - -dev-only-append-root-token
        - -template-dir=/vault/secrets
        env:
        - name: VAULT_ADDR
          value: "{{ .Values.global.vaultAddr }}"
        volumeMounts:
        - name: rendered-secrets
          mountPath: /vault/secrets
        securityContext:
          runAsNonRoot: false
          runAsUser: 0
      volumes:
      - name: rendered-secrets
        emptyDir: {}
---
{{- if and .Values.ragService.autoscaling .Values.ragService.autoscaling.enabled }}
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: {{ .Release.Name }}-rag-service-hpa
  namespace: {{ .Release.Namespace }}
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: {{ .Release.Name }}-rag-service
  minReplicas: {{ .Values.ragService.autoscaling.minReplicas }}
  maxReplicas: {{ .Values.ragService.autoscaling.maxReplicas }}
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: {{ .Values.ragService.autoscaling.targetCPUUtilizationPercentage }}
---
{{- end }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Release.Name }}-rag-service-sa
  namespace: {{ .Release.Namespace }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-rag-service
  namespace: {{ .Release.Namespace }}
spec:
  selector:
    app: rag-service
  ports:
  - port: 8001
    targetPort: 8001
{{- end }}
