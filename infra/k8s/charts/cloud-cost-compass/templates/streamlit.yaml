{{- if .Values.streamlit.enabled -}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}-streamlit-config
  namespace: {{ .Release.Namespace }}
data:
  MCP_SERVER_URL: "http://{{ .Release.Name }}-mcp-server:8000"
  RAG_SERVICE_URL: "http://{{ .Release.Name }}-rag-service:8001"
  KEYCLOAK_URL: "{{ .Values.global.keycloakUrl }}/realms/cloud-cost-compass"
  AUTH0_CLIENT_ID: "cloud-cost-compass"
  VAULT_ADDR: "{{ .Values.global.vaultAddr }}"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-streamlit
  namespace: {{ .Release.Namespace }}
spec:
  replicas: {{ .Values.streamlit.replicaCount }}
  selector:
    matchLabels:
      app: streamlit-app
  template:
    metadata:
      labels:
        app: streamlit-app
    spec:
      serviceAccountName: {{ .Release.Name }}-streamlit-sa
      {{- if .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- range .Values.imagePullSecrets }}
        - name: {{ .name }}
        {{- end }}
      {{- end }}
      containers:
      - name: streamlit
        image: {{ .Values.streamlit.image.repository }}:{{ .Values.streamlit.image.tag }}
        ports:
        - containerPort: 8501
        envFrom:
        - configMapRef:
            name: {{ .Release.Name }}-streamlit-config
        volumeMounts:
        - name: rendered-secrets
          mountPath: /etc/secrets
          readOnly: true
        {{- if .Values.streamlit.resources }}
        resources:
          {{- toYaml .Values.streamlit.resources | nindent 10 }}
        {{- end }}
      - name: vault-agent
        image: hashicorp/vault:1.16
        args:
        - agent
        - -dev-only-append-root-token
        - -template-dir=/vault/secrets
        env:
        - name: VAULT_ADDR
          value: "{{ .Values.global.vaultAddr }}"
        volumeMounts:
        - name: rendered-secrets
          mountPath: /vault/secrets
        securityContext:
          runAsNonRoot: false
          runAsUser: 0
      volumes:
      - name: rendered-secrets
        emptyDir: {}
---
{{- if and .Values.streamlit.autoscaling .Values.streamlit.autoscaling.enabled -}}
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: {{ .Release.Name }}-streamlit-hpa
  namespace: {{ .Release.Namespace }}
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: {{ .Release.Name }}-streamlit
  minReplicas: {{ .Values.streamlit.autoscaling.minReplicas }}
  maxReplicas: {{ .Values.streamlit.autoscaling.maxReplicas }}
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: {{ .Values.streamlit.autoscaling.targetCPUUtilizationPercentage }}
---
{{- end }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Release.Name }}-streamlit-sa
  namespace: {{ .Release.Namespace }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-streamlit
  namespace: {{ .Release.Namespace }}
spec:
  selector:
    app: streamlit-app
  ports:
  - port: 8501
    targetPort: 8501
{{- end }}
