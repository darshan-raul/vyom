apiVersion: v1
kind: ConfigMap
metadata:
  name: rag-service-config
  namespace: cloud-cost-compass
data:
  DATABASE_URL: "postgresql://postgres:postgres@postgres:5432/cccdb"
  QDRANT_URL: "http://qdrant:6334"
  BEDROCK_REGION: "ap-south-1"
  BEDROCK_EMBEDDING_MODEL_ID: ""
  BEDROCK_EMBEDDING_ALLOWED_MODELS: ""
  BEDROCK_EMBEDDING_DIMENSIONS: "1024"
  BEDROCK_POLICY_FILE: "/etc/secrets/bedrock-policy.json"
  VAULT_ADDR: "http://vault:8200"
  SECRETS_DIR: "/etc/secrets"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: rag-service
  namespace: cloud-cost-compass
spec:
  replicas: 1
  selector:
    matchLabels:
      app: rag-service
  template:
    metadata:
      labels:
        app: rag-service
    spec:
      serviceAccountName: rag-service-sa
      containers:
      - name: rag-service
        image: cloud-cost-compass/rag-service:latest
        ports:
        - containerPort: 8001
        envFrom:
        - configMapRef:
            name: rag-service-config
        volumeMounts:
        - name: rendered-secrets
          mountPath: /etc/secrets
          readOnly: true
      - name: vault-agent
        image: hashicorp/vault:1.16
        args:
        - agent
        - -dev-only-append-root-token
        - -template-dir=/vault/secrets
        env:
        - name: VAULT_ADDR
          value: "http://vault:8200"
        volumeMounts:
        - name: rendered-secrets
          mountPath: /vault/secrets
        securityContext:
          runAsNonRoot: false
          runAsUser: 0
      volumes:
      - name: rendered-secrets
        emptyDir: {}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: rag-service-sa
  namespace: cloud-cost-compass
---
apiVersion: v1
kind: Service
metadata:
  name: rag-service
  namespace: cloud-cost-compass
spec:
  selector:
    app: rag-service
  ports:
  - port: 8001
    targetPort: 8001
