# Extra grant for this exercise: lets the existing agent-reader identity read
# pod logs in `shop`. Kept separate from workloads.yaml so the first exercise's
# identity stays "pods and events only" until you choose to add this.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata: {name: agent-log-reader, namespace: shop}
rules:
  - apiGroups: [""]
    resources: [pods/log]
    verbs: [get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata: {name: agent-log-reader, namespace: shop}
subjects:
  - {kind: ServiceAccount, name: agent-reader, namespace: shop}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: agent-log-reader
