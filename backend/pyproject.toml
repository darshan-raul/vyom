[project]
name = "vyom"
version = "0.1.0"
description = "Vyom backend: FastAPI API, agent and MCP client"
authors = [
    { name = "Darshan Raul", email = "dar.raul@gmail.com" }
]
requires-python = ">=3.13,<3.14"
dependencies = [
    "fastapi>=0.143.0",
    "httpx>=0.28.1",
    "httpx2>=2.13.1",
    "langchain-core>=1.6.9",
    "langchain-openai>=1.7.0",
    "langsmith>=0.14.7",
    "mcp>=2.3.0",
    "openai>=3.29.0",
    "opentelemetry-exporter-otlp-proto-http>=1.45.1",
    "opentelemetry-instrumentation-fastapi>=0.66b1",
    "opentelemetry-sdk>=1.45.1",
    "prometheus-client>=0.26.0",
    "uvicorn>=0.54.0",
]

[build-system]
requires = ["uv_build>=0.11.16,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
    "ruff>=0.17.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
