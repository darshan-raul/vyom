# Package metadata. TOML is a settings format: [section] headers, key = value lines.
[project]
name = "vyom"
version = "0.1.0"
description = "Vyom backend: FastAPI API, agent and MCP client"
authors = [
    { name = "Darshan Raul", email = "dar.raul@gmail.com" }
]
# Only Python 3.13.x is supported.
requires-python = ">=3.13,<3.14"
# Libraries needed to run the app. ">=" means "this version or newer".
dependencies = [
    "fastapi>=0.143.0",
    "httpx>=0.28.1",
    "httpx2>=2.13.1",
    "langchain-core>=1.6.9",
    "langchain-openai>=1.7.0",
    "langgraph>=1.2.14",
    "langsmith>=0.14.7",
    "mcp>=2.3.0",
    "openai>=3.29.0",
    "opentelemetry-exporter-otlp-proto-http>=1.45.1",
    "opentelemetry-instrumentation-fastapi>=0.66b1",
    "opentelemetry-sdk>=1.45.1",
    "prometheus-client>=0.26.0",
    "uvicorn>=0.54.0",
]

# How the package is built (uv's build tool).
[build-system]
requires = ["uv_build>=0.11.16,<0.12.0"]
build-backend = "uv_build"

# Extra libraries needed only for development and testing, not for running the app.
[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
    "ruff>=0.17.0",
]

# pytest settings: look for tests in the tests/ folder.
[tool.pytest.ini_options]
testpaths = ["tests"]

# ruff is the code linter/formatter. Lines may be up to 100 characters.
[tool.ruff]
line-length = 100

[tool.ruff.lint]
# Rule sets to enable: E/F (basic errors), I (import order), B (likely bugs),
# UP (use modern Python syntax).
select = ["E", "F", "I", "B", "UP"]
