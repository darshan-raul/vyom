# grafana-community/loki 18.15.1 (Loki 3.7.8): one single-binary pod on a PVC.
deploymentMode: Monolithic
fullnameOverride: loki

loki:
  auth_enabled: false # internal Service only; this is not tenant isolation
  commonConfig:
    replication_factor: 1
  storage:
    type: filesystem
  schemaConfig:
    configs:
      - from: "2026-01-01"
        store: tsdb
        object_store: filesystem
        schema: v13
        index:
          prefix: index_
          period: 24h
  analytics:
    reporting_enabled: false
  compactor:
    retention_enabled: true
    delete_request_store: filesystem
  limits_config:
    retention_period: 48h
    reject_old_samples: true
    reject_old_samples_max_age: 48h
    ingestion_rate_mb: 2
    ingestion_burst_size_mb: 4
    max_line_size: 16KB
    max_label_names_per_series: 8
    max_global_streams_per_user: 500
    allow_structured_metadata: true
    volume_enabled: true

singleBinary:
  replicas: 1
  persistence:
    size: 4Gi
  resources:
    requests: { cpu: 50m, memory: 256Mi }
    limits: { memory: 768Mi }

# Unused in single-binary S1.
write:
  replicas: 0
read:
  replicas: 0
backend:
  replicas: 0
gateway:
  enabled: false
chunksCache:
  enabled: false
resultsCache:
  enabled: false
lokiCanary:
  enabled: false
test:
  enabled: false
sidecar:
  rules:
    enabled: false
monitoring:
  serviceMonitor:
    enabled: true
