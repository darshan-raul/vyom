# Upstream Kubernetes MCP server for Vyom on Kind (S1.3). Applied by scripts/mcp-up.sh,
# which also creates the kubernetes-mcp-config ConfigMap from config.toml.
# Both images are upstream releases pinned by digest; Vyom builds nothing here:
#   kubernetes-mcp-server v0.0.67, kube-rbac-proxy v0.23.0.
# Callers reach only the proxy (TLS, port 8443). It accepts a ServiceAccount token issued
# for the audience "vyom-mcp" (TokenReview) whose subject may use the endpoint
# (SubjectAccessReview), then forwards to the server on localhost. The server talks to
# Kubernetes as the kubernetes-mcp ServiceAccount whatever the caller presented.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: kubernetes-mcp
  namespace: vyom
---
# The backend's identity towards the MCP endpoint. It has no Kubernetes permissions.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: vyom-api
  namespace: vyom
automountServiceAccountToken: false
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: kubernetes-mcp-pod-reader
  namespace: demo
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: kubernetes-mcp-pod-reader
  namespace: demo
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: kubernetes-mcp-pod-reader
subjects:
  - kind: ServiceAccount
    name: kubernetes-mcp
    namespace: vyom
---
# What the proxy needs to check callers. These verbs read no cluster resources.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: vyom-kubernetes-mcp-caller-review
rules:
  - apiGroups: ["authentication.k8s.io"]
    resources: ["tokenreviews"]
    verbs: ["create"]
  - apiGroups: ["authorization.k8s.io"]
    resources: ["subjectaccessreviews"]
    verbs: ["create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: vyom-kubernetes-mcp-caller-review
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: vyom-kubernetes-mcp-caller-review
subjects:
  - kind: ServiceAccount
    name: kubernetes-mcp
    namespace: vyom
---
# Permission to call the MCP endpoint, expressed on a resource that exists only as an
# authorization name: it grants nothing in the Kubernetes API itself.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: kubernetes-mcp-caller
  namespace: vyom
rules:
  - apiGroups: ["vyom.dev"]
    resources: ["mcpendpoints"]
    resourceNames: ["kubernetes"]
    verbs: ["get", "create", "delete"]  # GET, POST and DELETE on the endpoint
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: kubernetes-mcp-caller
  namespace: vyom
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: kubernetes-mcp-caller
subjects:
  - kind: ServiceAccount
    name: vyom-api
    namespace: vyom
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: kubernetes-mcp-proxy
  namespace: vyom
data:
  config.yaml: |
    authorization:
      resourceAttributes:
        apiGroup: vyom.dev
        resource: mcpendpoints
        namespace: vyom
        name: kubernetes
---
apiVersion: v1
kind: Service
metadata:
  name: kubernetes-mcp
  namespace: vyom
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: kubernetes-mcp
  ports:
    - name: mcp
      port: 8443
      targetPort: mcp
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kubernetes-mcp
  namespace: vyom
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: kubernetes-mcp
  template:
    metadata:
      labels:
        app.kubernetes.io/name: kubernetes-mcp
    spec:
      serviceAccountName: kubernetes-mcp
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: server
          image: quay.io/containers/kubernetes_mcp_server@sha256:e47f6ccc5347e1ea6be495d8d9ab55ac8a995fe87800fb984fa770cebe14ad44
          args: ["--config", "/etc/kubernetes-mcp/config.toml"]
          resources:
            requests: {cpu: 20m, memory: 48Mi}
            limits: {memory: 192Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: config
              mountPath: /etc/kubernetes-mcp
              readOnly: true
        - name: proxy
          image: quay.io/brancz/kube-rbac-proxy@sha256:a6075902738eaf1780390561ea998a53a056ef1d2b312bcbf0e2e81fec084b3c
          args:
            - --secure-listen-address=0.0.0.0:8443
            - --upstream=http://127.0.0.1:8080/
            - --auth-token-audiences=vyom-mcp
            - --config-file=/etc/proxy/config.yaml
            - --tls-cert-file=/etc/tls/tls.crt
            - --tls-private-key-file=/etc/tls/tls.key
            - --ignore-paths=/healthz  # kubelet probes only; reaches the server's /healthz
          ports:
            - name: mcp
              containerPort: 8443
          readinessProbe:
            httpGet: {path: /healthz, port: mcp, scheme: HTTPS}
            periodSeconds: 5
          livenessProbe:
            httpGet: {path: /healthz, port: mcp, scheme: HTTPS}
            periodSeconds: 20
          resources:
            requests: {cpu: 10m, memory: 24Mi}
            limits: {memory: 96Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: proxy-config
              mountPath: /etc/proxy
              readOnly: true
            - name: tls
              mountPath: /etc/tls
              readOnly: true
      volumes:
        - name: config
          configMap:
            name: kubernetes-mcp-config
        - name: proxy-config
          configMap:
            name: kubernetes-mcp-proxy
        - name: tls
          secret:
            secretName: kubernetes-mcp-tls
