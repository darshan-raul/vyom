apiVersion: v1
kind: Service
metadata:
  name: vyom-ui
  labels: {{- include "vyom.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: vyom-ui
  ports:
    - {name: http, port: 8080, targetPort: http}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: vyom-ui
  labels: {{- include "vyom.labels" . | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: vyom-ui
  template:
    metadata:
      labels:
        app.kubernetes.io/name: vyom-ui
    spec:
      automountServiceAccountToken: false
      securityContext: {{- include "vyom.podSecurity" . | nindent 8 }}
      containers:
        - name: ui
          image: {{ .Values.images.ui.repository }}:{{ .Values.images.ui.tag }}
          imagePullPolicy: {{ .Values.images.pullPolicy }}
          ports:
            - {name: http, containerPort: 8080}
          readinessProbe:
            httpGet: {path: /, port: http}
            periodSeconds: 5
          resources: {{- toYaml .Values.ui.resources | nindent 12 }}
          securityContext: {{- include "vyom.containerSecurity" . | nindent 12 }}
          volumeMounts:  # nginx writes its pid, temp files and cache here
            - {name: tmp, mountPath: /tmp}
      volumes:
        - name: tmp
          emptyDir: {sizeLimit: 32Mi}
