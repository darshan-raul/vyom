# Upstream Kubernetes MCP server (pinned image, Vyom builds nothing) behind kube-rbac-proxy.
# Callers reach only the proxy (TLS, 8443). It accepts a ServiceAccount token issued for the
# audience "vyom-mcp" (TokenReview) whose subject may use the endpoint (SubjectAccessReview),
# then forwards to the server on localhost. The server talks to Kubernetes as the
# kubernetes-mcp ServiceAccount whatever the caller presented (MCPK01).
apiVersion: v1
kind: ConfigMap
metadata:
  name: kubernetes-mcp-config
  labels: {{- include "vyom.labels" . | nindent 4 }}
data:
  config.toml: |
{{ .Files.Get "files/kubernetes-mcp.toml" | indent 4 }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: kubernetes-mcp-proxy
  labels: {{- include "vyom.labels" . | nindent 4 }}
data:
  config.yaml: |
    authorization:
      resourceAttributes:
        apiGroup: vyom.dev
        resource: mcpendpoints
        namespace: {{ .Release.Namespace }}
        name: kubernetes
---
apiVersion: v1
kind: Service
metadata:
  name: kubernetes-mcp
  labels: {{- include "vyom.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: kubernetes-mcp
  ports:
    - name: mcp
      port: 8443
      targetPort: mcp
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kubernetes-mcp
  labels: {{- include "vyom.labels" . | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: kubernetes-mcp
  template:
    metadata:
      labels:
        app.kubernetes.io/name: kubernetes-mcp
      annotations:
        vyom.dev/config-checksum: {{ .Values.mcp.checksum | quote }}
    spec:
      serviceAccountName: kubernetes-mcp
      securityContext: {{- include "vyom.podSecurity" . | nindent 8 }}
      containers:
        - name: server
          image: {{ .Values.images.kubernetesMcp }}
          args: ["--config", "/etc/kubernetes-mcp/config.toml"]
          resources:
            requests: {cpu: 20m, memory: 48Mi}
            limits: {memory: 192Mi}
          securityContext: {{- include "vyom.containerSecurity" . | nindent 12 }}
          volumeMounts:
            - {name: config, mountPath: /etc/kubernetes-mcp, readOnly: true}
        - name: proxy
          image: {{ .Values.images.kubeRbacProxy }}
          args:
            - --secure-listen-address=0.0.0.0:8443
            - --upstream=http://127.0.0.1:8080/
            - --auth-token-audiences=vyom-mcp
            - --config-file=/etc/proxy/config.yaml
            - --tls-cert-file=/etc/tls/tls.crt
            - --tls-private-key-file=/etc/tls/tls.key
            - --ignore-paths=/healthz  # kubelet probes only; reaches the server's /healthz
          ports:
            - {name: mcp, containerPort: 8443}
          readinessProbe:
            httpGet: {path: /healthz, port: mcp, scheme: HTTPS}
            periodSeconds: 5
          livenessProbe:
            httpGet: {path: /healthz, port: mcp, scheme: HTTPS}
            periodSeconds: 20
          resources:
            requests: {cpu: 10m, memory: 24Mi}
            limits: {memory: 96Mi}
          securityContext: {{- include "vyom.containerSecurity" . | nindent 12 }}
          volumeMounts:
            - {name: proxy-config, mountPath: /etc/proxy, readOnly: true}
            - {name: tls, mountPath: /etc/tls, readOnly: true}
      volumes:
        - name: config
          configMap: {name: kubernetes-mcp-config}
        - name: proxy-config
          configMap: {name: kubernetes-mcp-proxy}
        - name: tls
          secret: {secretName: {{ .Values.mcp.tlsSecret }}}
