<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc">
<title id="title">Vyom planned deployment architecture</title>
<desc id="desc">Kind from S1, EKS from S2. Inside the cluster are frontend, a single FastAPI and LangGraph backend, Keycloak from S6, jobs and Postgres/Qdrant from S3, a pinned upstream Kubernetes MCP server, and the full observability namespace from S1. External dependencies include a configured compatible model endpoint, Bedrock from S3, AWS-managed MCP and AWS APIs from S2, and protected backup storage from S5. Five main connections show HTTP, private MCP, scoped Kubernetes reads, storage clients and external provider calls.</desc>
