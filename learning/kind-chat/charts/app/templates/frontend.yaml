apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "kindchat.name" . }}-frontend
  labels:
    {{- include "kindchat.labels" . | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/instance: {{ .Release.Name | quote }}
      app.kubernetes.io/component: frontend
  template:
    metadata:
      labels:
        {{- include "kindchat.labels" . | nindent 8 }}
        app.kubernetes.io/component: frontend
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
        runAsGroup: 101
        fsGroup: 101
      containers:
        - name: frontend
          image: "{{ .Values.images.frontend.repository }}:{{ .Values.images.frontend.tag }}"
          imagePullPolicy: {{ .Values.images.pullPolicy }}
          ports:
            - {name: http, containerPort: 8080}
          env:
            - {name: BACKEND_HOST, value: {{ printf "%s-api" (include "kindchat.name" .) | quote }}}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          volumeMounts:
            - {name: generated-config, mountPath: /etc/nginx/conf.d}
            - {name: tmp, mountPath: /tmp}
          readinessProbe:
            httpGet: {path: /, port: http}
            initialDelaySeconds: 3
          livenessProbe:
            httpGet: {path: /, port: http}
            initialDelaySeconds: 10
          resources:
            {{- toYaml .Values.resources.frontend | nindent 12 }}
      volumes:
        - {name: generated-config, emptyDir: {sizeLimit: 1Mi}}
        - {name: tmp, emptyDir: {sizeLimit: 16Mi}}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "kindchat.name" . }}-frontend
  labels:
    {{- include "kindchat.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/instance: {{ .Release.Name | quote }}
    app.kubernetes.io/component: frontend
  ports:
    - {name: http, port: 80, targetPort: http}
